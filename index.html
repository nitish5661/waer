<!DOCTYPE html>
<html>
<head>
  <title>WhatsApp AI Reply</title>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <h1>WhatsApp AI Reply</h1>
  <div id="status">Loading QR...</div>
  <div id="qr"></div>
  <div id="messages"></div>
  <script>
    const socket = io();

    socket.on('qr', qr => {
      document.getElementById('status').textContent = 'Scan this QR code:';
      const img = document.createElement('img');
      img.src = qr;
      img.width = 200;
      document.getElementById('qr').appendChild(img);
    });

    socket.on('ready', () => {
      document.getElementById('status').textContent = 'WhatsApp is ready!';
      document.getElementById('qr').innerHTML = '';
    });

    socket.on('message', data => {
      const msgDiv = document.createElement('div');
      msgDiv.innerHTML = `
        <p><strong>${data.from}:</strong> ${data.body}</p>
        <p>🤖 <em>AI Suggestion:</em> ${data.ai}</p>
        <input placeholder="Reply...">
        <button onclick="sendReply('${data.from}', this.previousElementSibling.value)">Send</button>
        <hr>
      `;
      document.getElementById('messages').appendChild(msgDiv);
    });

    function sendReply(to, text) {
      fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to, text })
      });
    }
  </script>
</body>
</html>
